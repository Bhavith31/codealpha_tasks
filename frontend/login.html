<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ShopEasy</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="panel auth-box">
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>
      <form id="login-form">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" required />
        <label for="l-password">Password</label>
        <input type="password" id="l-password" required />
        <div class="form-error" id="login-error"></div>
        <button class="btn btn-block" style="margin-top:18px">Login</button>
      </form>
      <form id="register-form" hidden>
        <label for="r-name">Full name</label>
        <input type="text" id="r-name" required />
        <label for="r-email">Email</label>
        <input type="email" id="r-email" required />
        <label for="r-password">Password (min 6 characters)</label>
        <input type="password" id="r-password" minlength="6" required />
        <div class="form-error" id="register-error"></div>
        <button class="btn btn-block" style="margin-top:18px">Create account</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
